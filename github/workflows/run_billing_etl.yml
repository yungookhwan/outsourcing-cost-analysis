name: 외주공사 기성 구글시트 자동 적재 파이프라인

on:
  push:
    paths:
      - 'data/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          pip install openpyxl pandas gspread google-auth

      - name: 기성 파싱 및 구글 시트 적재 실행
        env:
          GCP_SA_KEY: ${{ secrets.OUTSOURCING_GCP_KEY }}
          SPREADSHEET_ID: ${{ secrets.OUTSOURCING_SHEET_ID }}
        run: |
          python scripts/batch_billing_processor.py
