name: 외주공사 기성 구글시트 자동 적재 파이프라인

on:
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas gspread google-auth

      - name: 기성 엑셀 일괄 파싱 및 구글 시트 적재 실행
        env:
          # GitHub Secrets 이름(OUTSOURCING_GCP_KEY)과 매핑
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.OUTSOURCING_GCP_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python scripts/batch_billing_processor.py
